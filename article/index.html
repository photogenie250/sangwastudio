<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gakoro Media TV — News</title>
<meta name="description" content="GAKORO MEDIA TV news report.">
<link rel="icon" type="image/x-icon" href="/assets/favicon/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">
<link rel="manifest" href="/assets/favicon/site.webmanifest">
<meta name="theme-color" content="#0E1C2B">
<!-- GOOGLE ADSENSE — see README.md "Monetization". Wire your publisher ID into js/consent.js's window.loadAds(), not here, so ads only load after cookie consent. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #0E1C2B;
    --navy-soft: #16283C;
    --crimson: #D3242C;
    --crimson-dark: #9C1A20;
    --paper: #0B1524;
    --card: #122238;
    --ink: #F2F0E9;
    --slate: #A9B4C4;
    --slate-light: #8B93A3;
    --gold: #C69A4E;
    --line: #23364F;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a{color:inherit; text-decoration:none;}

  /* ---------- MASTHEAD ---------- */
  .masthead{
    background: var(--navy);
    color:#fff;
    padding: 14px 6vw;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom: 1px solid rgba(255,255,255,0.12);
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{
    width:34px; height:34px;
    background: var(--crimson);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces', serif; font-weight:900; font-size:18px;
    flex-shrink:0;
  }
  .brand-name{ font-family:'Fraunces', serif; font-weight:900; font-size:22px; letter-spacing:-0.01em; }
  .back-link{
    display:flex; align-items:center; gap:8px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px; letter-spacing:0.08em; text-transform:uppercase;
    color: var(--slate-light);
    transition: color .15s ease;
  }
  .back-link:hover{ color:#fff; }

  /* ---------- ARTICLE ---------- */
  main{ max-width:800px; margin:0 auto; padding: 48px 6vw 100px; }

  .art-meta-row{
    display:flex; align-items:center; gap:12px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase;
    color: var(--crimson);
    margin-bottom:16px;
  }
  .art-meta-row .breaking-tag{
    background: var(--crimson-dark);
    border:1px solid var(--crimson);
    color:#fff;
    padding:3px 8px;
  }

  .art-headline{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 40px;
    line-height:1.14;
    letter-spacing:-0.01em;
    margin-bottom:16px;
  }
  .art-dek{
    font-size:17px;
    line-height:1.6;
    color: var(--slate);
    margin-bottom:22px;
    max-width: 62ch;
  }
  .art-byline{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    font-size:12.5px;
    color: var(--slate-light);
    font-family:'IBM Plex Mono', monospace;
    padding-bottom:26px;
    border-bottom:1px solid var(--line);
    margin-bottom:30px;
  }
  .art-byline .sep{ opacity:0.5; }
  .share-btn{
    display:flex; align-items:center; gap:6px;
    background: transparent;
    border:1px solid var(--line);
    color: var(--slate-light);
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:6px 12px;
    cursor:pointer;
    transition: border-color .15s ease, color .15s ease;
  }
  .art-stats{
    display:flex; align-items:center; gap:10px;
    margin-left:auto;
  }
  .views-count{
    display:flex; align-items:center; gap:6px;
    color: var(--slate-light);
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    letter-spacing:0.04em;
  }
  .views-count svg{ width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2; flex-shrink:0; }
  .share-btn svg{ width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2; flex-shrink:0; }
  .share-btn:hover{ border-color: var(--gold); color:#fff; }
  .share-btn.copied{ border-color: var(--gold); color:#fff; }
  .like-btn{
    display:flex; align-items:center; gap:6px;
    background: transparent;
    border:1px solid var(--line);
    color: var(--slate-light);
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    padding:6px 12px;
    cursor:pointer;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  .like-btn svg{ width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2; flex-shrink:0; }
  .like-btn:hover{ border-color: var(--crimson); color:#fff; }
  .like-btn.liked{
    border-color: var(--crimson);
    background: var(--crimson-dark);
    color:#fff;
  }
  .like-btn.liked svg{ fill: currentColor; }
  .like-btn:disabled{ cursor:default; }

  .art-photo-wrap{
    position:relative;
    width:100%;
    aspect-ratio: 16/10;
    background: var(--card);
    border:1px solid var(--line);
    overflow:hidden;
    margin-bottom:12px;
  }
  .art-photo-wrap img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .art-photo-caption{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color: var(--slate-light);
    line-height:1.5;
    padding-bottom:34px;
    border-bottom:1px solid var(--line);
    margin-bottom:34px;
  }

  /* ---------- REPORT BOX ---------- */
  .report-box{
    background: var(--card);
    border:1px solid var(--line);
    border-left:3px solid var(--crimson);
    padding: 28px 30px 32px;
  }
  .report-label{
    display:flex; align-items:center; gap:8px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase;
    color: var(--gold);
    margin-bottom:20px;
  }
  .report-label::before{
    content:"";
    width:16px; height:1px;
    background: var(--gold);
  }
  .report-body{
    font-size:16px;
    line-height:1.85;
    color: var(--ink);
  }
  .report-body p{ margin-bottom:20px; }
  .report-body p:last-child{ margin-bottom:0; }

  /* ---------- GALLERY (up to 4 extra photos, end of report) ---------- */
  .art-gallery{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap:10px;
    margin-top:30px;
  }
  .art-gallery-item{
    aspect-ratio: 4/3;
    background: var(--card);
    border:1px solid var(--line);
    overflow:hidden;
  }
  .art-gallery-item img{
    width:100%; height:100%; object-fit:cover; display:block;
  }

  /* ---------- COMMENTS ---------- */
  /* Placeholder ad slot — see README.md "Monetization". Empty and
     invisible until you drop a real <ins class="adsbygoogle"> unit
     inside it, so it never reserves blank space in the meantime. */
  .ad-slot{ margin: 34px 0; }
  .ad-slot:empty{ display:none; }

  .comments-section{
    max-width:800px;
    margin: 46px auto 0;
    padding-top: 40px;
    border-top: 1px solid var(--line);
  }
  .comments-heading{
    display:flex; align-items:center; gap:10px;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:22px;
    margin-bottom:22px;
  }
  .comments-heading span.count{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    font-weight:600;
    color: var(--slate-light);
  }
  .comment-form{
    background: var(--card);
    border:1px solid var(--line);
    padding: 22px 22px 20px;
    margin-bottom: 32px;
  }
  .comment-form-row{
    display:grid;
    grid-template-columns: 1fr;
    gap:12px;
    margin-bottom:12px;
  }
  .comment-form input[type="text"],
  .comment-form textarea{
    width:100%;
    background: var(--paper);
    border:1px solid var(--line);
    color: var(--ink);
    font-family:'Inter', sans-serif;
    font-size:14.5px;
    padding:11px 13px;
    resize:vertical;
  }
  .comment-form textarea{ min-height:96px; line-height:1.5; }
  .comment-form input::placeholder,
  .comment-form textarea::placeholder{ color: var(--slate-light); }
  .comment-form input:focus,
  .comment-form textarea:focus{ outline:none; border-color: var(--gold); }
  .comment-form-foot{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .comment-char-count{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color: var(--slate-light);
  }
  .comment-submit-btn{
    background: var(--crimson);
    color:#fff;
    border:none;
    padding:11px 22px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase;
    cursor:pointer;
    transition: background .15s ease;
  }
  .comment-submit-btn:hover{ background: var(--crimson-dark); }
  .comment-submit-btn:disabled{ opacity:.5; cursor:default; }
  .comment-form-msg{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    margin-top:12px;
    display:none;
  }
  .comment-form-msg.show{ display:block; }
  .comment-form-msg.ok{ color: var(--gold); }
  .comment-form-msg.err{ color: var(--crimson); }
  /* honeypot field — hidden from real visitors, catches simple bots */
  .comment-hp{
    position:absolute !important;
    left:-9999px !important;
    width:1px; height:1px;
    opacity:0;
    pointer-events:none;
  }
  .comment-list{ display:flex; flex-direction:column; gap:20px; }
  .comment-item{
    padding-bottom:20px;
    border-bottom:1px solid var(--line);
  }
  .comment-item:last-child{ border-bottom:none; padding-bottom:0; }
  .comment-item-head{
    display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
    margin-bottom:6px;
  }
  .comment-author{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:13px;
    color:#fff;
  }
  .comment-date{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color: var(--slate-light);
  }
  .comment-body{
    font-size:14.5px;
    line-height:1.65;
    color: var(--ink);
    white-space:pre-wrap;
    word-break: break-word;
  }
  .comments-empty, .comments-loading{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color: var(--slate-light);
    padding: 10px 0 6px;
  }

  /* ---------- STATES ---------- */
  .state-box{
    max-width:800px;
    margin: 0 auto;
    padding: 90px 6vw;
    text-align:center;
  }
  .state-box .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase;
    color: var(--crimson); margin-bottom:14px;
  }
  .state-box h1{
    font-family:'Fraunces', serif; font-weight:600; font-size:26px; margin-bottom:12px;
  }
  .state-box p{ color: var(--slate); font-size:14.5px; margin-bottom:22px; }
  .state-box a.btn{
    display:inline-block;
    background: var(--crimson);
    color:#fff;
    padding:10px 20px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase;
  }

  /* ---------- FOOTER ---------- */
  footer{
    background: var(--navy);
    color: var(--slate-light);
    padding: 30px 6vw;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.04em;
  }
  footer .brand-name{ font-size:16px; color:#fff; }
  .footer-legal{ display:flex; align-items:center; gap:18px; }
  .footer-legal a:hover{ color:#fff; }

  @media (max-width: 640px){
    .masthead{ padding:12px 5vw; }
    main{ padding: 34px 5vw 70px; }
    .art-headline{ font-size:27px; }
    .art-dek{ font-size:15px; }
    .report-box{ padding:22px 18px 26px; }
    .art-gallery{ grid-template-columns: 1fr 1fr; gap:8px; }
    .comment-form{ padding:18px 16px 16px; }
    footer{ flex-direction:column; gap:10px; text-align:center; padding:24px 5vw; }
  }
</style>
</head>
<body>

<header class="masthead">
  <a href="/" class="brand" aria-label="GAKORO MEDIA TV — Home">
    <div class="brand-mark">G</div>
    <div class="brand-name">GAKORO MEDIA TV</div>
  </a>
  <a href="/" class="back-link">&larr; All headlines</a>
</header>

<main id="articleMain">
  <div class="state-box" id="loadingState">
    <div class="eyebrow">Loading</div>
    <h1>Fetching the report&hellip;</h1>
  </div>
</main>

<footer>
  <div class="brand-name">GAKORO MEDIA TV</div>
  <div class="footer-legal">
    <a href="/privacy/">Privacy Policy</a>
    <a href="/terms/">Terms of Use</a>
    <span>&copy; <span id="yearNow"></span> GAKORO MEDIA TV</span>
  </div>
</footer>

<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script defer src="../js/config.js"></script>
<script defer src="../js/article.js"></script>
<script defer src="../js/consent.js"></script>
</body>
</html>
