<svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#14264A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background card -->
  <rect x="30" y="30" width="940" height="360" rx="80" fill="#FFFFFF" filter="url(#cardShadow)"/>

  <!-- Wordmark -->
  <text x="500" y="235" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="150" letter-spacing="4" fill="#14264A" text-anchor="middle">NDERA</text>

  <!-- SYSTEM -->
  <text x="500" y="330" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="76" letter-spacing="14" fill="#4C9A3D" text-anchor="middle">SYSTEM</text>
</svg>
